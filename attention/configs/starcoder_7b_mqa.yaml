# StarCoderBase-7B — canonical 7B-class MQA model.
# Architecture: gpt_bigcode, multi_query=True, learned absolute positions (wpe).
#
# NOTE: bigcode/starcoderbase-7b is a GATED model on HuggingFace. You must
#   (1) accept the license on the model page, and
#   (2) run `huggingface-cli login` with a token on the approved account
# before `extract_weights.py` will succeed.
#
# The dims below are the expected values. `extract_weights.py` will read
# the real HF config and raise if they don't match — treat this YAML as a
# hypothesis that the checkpoint confirms, not as source of truth.
name: starcoder_7b_mqa
hf_repo: bigcode/starcoderbase-7b
variant: MQA
layer_index: 0
hidden_size: 4096
num_attention_heads: 32
num_key_value_heads: 1
head_dim: 128
max_position_embeddings: 8192
# gpt_bigcode has no RoPE; the field is ignored by StarCoderMQA but kept
# for AttentionConfig's uniform schema.
rope_theta: 0.0
weights_path: weights/starcoder_7b_mqa_layer0.safetensors
sweeps:
  seq_lens: [128, 256, 512, 1024, 2048, 4096, 8192]
  batches:  [1, 4, 16, 32]
warmup: 10
iters:   50
